# Historical Kaggle profile, retained for reproducibility. Not the active training route.
profile: kaggle
execution_mode: cli_kernel
cli_allocation_enabled: true
project_root: /kaggle/temp/Gen_AI_Assignment_2
cache_root: /kaggle/temp/.cache
model_cache: /kaggle/temp/.cache/huggingface
